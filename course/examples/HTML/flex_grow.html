<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flex Grow</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
    }

    .layout {
      display: flex;
      gap: 20px; /* Отступы между колонками */
      height: 200px;
    }

    .sidebar {
      width: 150px; /* Фиксированная ширина */
      background-color: #ffc107;
      padding: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      font-weight: bold;
    }

    .content {
      flex: 1; /* <--- Занимает всё оставшееся место */
      background-color: #198754;
      color: white;
      padding: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      font-weight: bold;
    }

    .label {
      margin-bottom: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="label">Желтый блок имеет фиксированную ширину (150px). Зеленый блок имеет <code>flex: 1</code>.</div>
  
  <div class="layout">
    <div class="sidebar">
      SIDEBAR<br>
      width: 150px
    </div>
    <div class="content">
      CONTENT<br>
      flex: 1 (занимает всё свободное место)
    </div>
  </div>

  <p style="margin-top: 15px;">Попробуйте сузить окно браузера или растянуть его. Зеленый блок будет автоматически расширяться и сужаться, а желтый останется фиксированным.</p>

</body>
</html>
