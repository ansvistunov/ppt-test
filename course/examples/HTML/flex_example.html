<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мини-практикум: Карточка</title>
  <style>
    /* 1. Сбрасываем box-sizing для всех элементов (как учили в Блочной модели) */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
    }

    /* 2. Контейнер для ряда карточек (Flex-родитель) */
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap; /* Позволяет карточкам переноситься на новую строку на маленьких экранах */
    }

    /* 3. Сама карточка */
    .card {
      display: flex;
      flex-direction: column; /* Элементы внутри выстраиваются сверху вниз */
      gap: 8px;
      
      width: 250px; /* Фиксированная ширина карточки */
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    /* 4. Изображение */
    .card img {
      width: 100%; /* Тянется на всю ширину карточки */
      height: 150px; /* Фиксируем высоту для аккуратного вида */
      object-fit: cover; /* Чтобы картинки не искажались */
      border-radius: 4px;
      display: block;
      background-color: #f8f8f8; /* Серый фон, пока грузится картинка */
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      color: #666;
      line-height: 1.4;
    }

    /* 5. Кнопка */
    .card button {
      margin-top: auto; /* МАГИЯ FLEXBOX: прижимает кнопку к низу */
      padding: 10px;
      background-color: #198754; /* Зеленый цвет для фруктов */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .card button:hover {
      background-color: #157347;
    }
  </style>
</head>
<body>

  <!-- Контейнер с карточками -->
  <div class="cards-container">
    
    <!-- Карточка 1 (с коротким описанием) -->
    <div class="card">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Apple.jpg?width=400" alt="Красные яблоки">
      <h3>Яблоки красные</h3>
      <p>Сочные и сладкие яблоки сорта Ред Чиф.</p>
      <button>В корзину</button>
    </div>

    <!-- Карточка 2 (с длинным описанием) -->
    <div class="card">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Banana.jpg?width=400" alt="Бананы">
      <h3>Бананы</h3>
      <p>Спелые бананы из Эквадора. Богаты калием и витаминами. Отлично подходят для завтрака, выпечки и перекуса на бегу.</p>
      <button>В корзину</button>
    </div>

    <!-- Карточка 3 (со средним описанием) -->
    <div class="card">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Strawberry.jpg?width=400" alt="Клубника">
      <h3>Свежая клубника</h3>
      <p>Сладкая ароматная клубника, собранная вручную.</p>
      <button>В корзину</button>
    </div>

  </div>

</body>
</html>
