<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
    }

    .gallery {
      display: grid;
      /* Делим контейнер на 3 равные колонки */
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .gallery-item {
      border: 2px solid #0d6efd;
      border-radius: 8px;
      overflow: hidden;
      background-color: white;
    }

    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .gallery-item p {
      margin: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      color: #333;
      background-color: #e9ecef;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Apple.jpg?width=400" alt="Яблоко">
      <p>Фото 1</p>
    </div>
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Banana.jpg?width=400" alt="Банан">
      <p>Фото 2</p>
    </div>
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Strawberry.jpg?width=400" alt="Клубника">
      <p>Фото 3</p>
    </div>
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Orange-Citrus-Fruit.jpg?width=400" alt="Апельсин">
      <p>Фото 4</p>
    </div>
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Grapes.jpg?width=400" alt="Виноград">
      <p>Фото 5</p>
    </div>
    <div class="gallery-item">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Pineapple.jpg?width=400" alt="Ананас">
      <p>Фото 6</p>
    </div>
  </div>

</body>
</html>
